- name: Install firewalld + python bindings (Ubuntu)
  become: yes
  apt:
    update_cache: yes
    name:
      - firewalld
      - python3-firewall
      - podman
    state: present
  
- name: Disable UFW if present
  become: yes
  community.general.ufw:
    state: disabled
  ignore_errors: yes

- name: Ensure firewalld is running
  become: yes
  service:
    name: firewalld
    state: started
    enabled: yes

- name: Open Guacamole HTTP port
  become: yes
  ansible.posix.firewalld:
    zone: public
    port: 8080/tcp
    state: enabled
    immediate: true
    permanent: true

- name: Ensure /etc/guacamole exists
  ansible.builtin.file:
    path: /etc/guacamole
    state: directory
    mode: '0755'
  become: yes

- name: Deploy guacamole.properties
  ansible.builtin.template:
    src: guacamole.properties.j2
    dest: /etc/guacamole/guacamole.properties
    mode: '0644'
  become: yes

- name: Deploy user-mapping.xml
  ansible.builtin.template:
    src: user-mapping.xml.j2
    dest: /etc/guacamole/user-mapping.xml
    mode: '0600'
  become: yes

- name: Remove existing guacamole/guacd containers (if any)
  ansible.builtin.shell: |
    podman rm -f guacd || true
    podman rm -f guacamole || true
  become: yes

- name: Run guacd container
  ansible.builtin.command: >
    podman run -d
    --name guacd
    --network host
    -v /etc/guacamole:/etc/guacamole:ro
    docker.io/guacamole/guacd
  become: yes

- name: Run guacamole container
  ansible.builtin.command: >
    podman run -d
    --name guacamole
    --network host
    -e GUACAMOLE_HOME=/etc/guacamole
    -v /etc/guacamole:/etc/guacamole:ro
    docker.io/guacamole/guacamole
  become: yes

- name: Wait for Guacamole web app to start
  ansible.builtin.wait_for:
    port: 8080
    delay: 10
    timeout: 60
  become: yes