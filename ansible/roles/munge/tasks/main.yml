---
- name: Ensure Munge is installed
  ansible.builtin.package:
    name: munge
    state: present
  become: true

- name: Ensure /etc/munge directory exists
  ansible.builtin.file:
    path: /etc/munge
    state: directory
    owner: munge
    group: munge
    mode: '0700'
  become: true

# Only generate key on controller
- name: Generate Munge key on controller if missing
  ansible.builtin.command: dd if=/dev/urandom of=/etc/munge/munge.key bs=1 count=1024
  args:
    creates: /etc/munge/munge.key
  become: true
  when: inventory_hostname == groups['login'][0]

# Fetch the key from controller
- name: Fetch Munge key from controller
  ansible.builtin.fetch:
    src: /etc/munge/munge.key
    dest: roles/munge/files/munge.key
    flat: yes
  become: true
  when: inventory_hostname == groups['login'][0]

# Distribute key to all other nodes
- name: Copy Munge key to all non-controller nodes
  ansible.builtin.copy:
    src: files/munge.key
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
  become: true
  when: inventory_hostname != groups['login'][0]

- name: Enable and start Munge service
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true
  become: true

